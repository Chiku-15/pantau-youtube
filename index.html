<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemantau YouTube</title>
<style>
:root{--bg:#EEF2F8;--surface:#fff;--ink:#112240;--muted:#5B6B86;--line:#D9E1EE;--views:#D7263D;--likes:#2A6FDB;--comments:#0F9D78;--ok:#0F9D78;--ac:#2A6FDB;--bm:#D7263D;--bm2:#D9822B;--tr:#2A6FDB;--tr2:#0E9AA7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1424;--surface:#142039;--ink:#E8EEF9;--muted:#93A3BF;--line:#26365A;--views:#FF5468;--likes:#5B9BFF;--comments:#35C9A0;--ok:#35C9A0;--ac:#5B9BFF;--bm:#FF5468;--bm2:#FFA94D;--tr:#5B9BFF;--tr2:#35C9D4;color-scheme:dark}}
.theme-btn{padding:7px 11px;border-radius:99px;font-size:1rem;line-height:1;flex:none}
/* navigasi atas ala website */
.topnav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tn{max-width:1280px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;border:0;background:transparent;color:var(--ink);padding:4px 2px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ok));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.62rem;font-style:normal}
.tn-links{display:flex;gap:2px;margin-left:4px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);border-radius:99px;padding:3px}
.tn-links button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:99px;font-weight:700;font-size:.9rem;line-height:1.2;white-space:nowrap}
.tn-links button:hover{color:var(--ink);background:var(--surface)}
.tn-links button[aria-current="true"]{color:#fff;background:var(--ac);box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 45%,transparent)}
.tn-search{flex:1;min-width:150px;max-width:330px;margin-left:auto}
.tn-search input{width:100%;padding:8px 14px;border-radius:99px;font-size:.9rem}
@media(max-width:680px){.tn-search{display:none}.tn-links{margin-left:auto}}
:root[data-theme="light"]{--bg:#EEF2F8;--surface:#fff;--ink:#112240;--muted:#5B6B86;--line:#D9E1EE;--views:#D7263D;--likes:#2A6FDB;--comments:#0F9D78;--ok:#0F9D78;--ac:#2A6FDB;--bm:#D7263D;--bm2:#D9822B;--tr:#2A6FDB;--tr2:#0E9AA7;color-scheme:light}
:root[data-theme="dark"]{--bg:#0C1424;--surface:#142039;--ink:#E8EEF9;--muted:#93A3BF;--line:#26365A;--views:#FF5468;--likes:#5B9BFF;--comments:#35C9A0;--ok:#35C9A0;--ac:#5B9BFF;--bm:#FF5468;--bm2:#FFA94D;--tr:#5B9BFF;--tr2:#35C9D4;color-scheme:dark}
.mvtools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.mvtools input{flex:1;min-width:180px}
.mvrow{display:grid;grid-template-columns:28px 96px 1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;margin-bottom:8px;background:var(--surface)}
.mvrow img{width:96px;height:54px;object-fit:cover;border-radius:6px;background:var(--line)}
.mvrow .rk{color:var(--muted);font-weight:700;text-align:center}
.mvrow .tt{min-width:0}
.mvrow .tt b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvrow small{display:block;color:var(--muted);font-weight:500}
.mvrow .tot{text-align:right;font-variant-numeric:tabular-nums}
.mvrow .tot b{display:block}
.mvrow .up{color:var(--ok);font-size:.8rem;font-weight:600}
@media(max-width:640px){.mvrow{grid-template-columns:24px 72px 1fr}.mvrow img{width:72px;height:40px}.mvrow .bars,.mvrow .tot{grid-column:3}.mvrow .tot{text-align:left}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
#tabs{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input{flex:1;min-width:220px}
button{font-weight:600;cursor:pointer}
button:hover{border-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#status{font-size:.9rem;color:var(--muted);margin:0 0 14px}
#status.err{color:var(--views)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--muted)}
#list{display:grid;gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:160px 1fr;gap:14px}
.card.sel{border-color:var(--likes)}
.card img{width:160px;height:90px;object-fit:cover;border-radius:6px;background:var(--line)}
.card h2{font-size:1rem;margin:0}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.ch{color:var(--muted);font-size:.85rem;margin:0 0 6px}
.stats{display:flex;flex-wrap:wrap;gap:4px 22px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.4rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.delta{font-size:.8rem;font-weight:600;color:var(--ok);margin-left:6px}
.acts{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.acts button{padding:4px 12px;font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#gain{color:var(--muted);font-size:.9rem;margin:0 0 4px}
#readout{min-height:1.5em;font-size:.9rem;margin:0 0 6px;font-weight:600}
#chart{width:100%;height:auto;display:block;touch-action:pan-y}
#chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px;margin-top:8px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-size:.9rem}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.note{color:var(--muted);font-size:.82rem}
#sstat{margin:0 0 4px;font-size:.95rem}
#sread{min-height:1.5em;font-size:.9rem;margin:0 0 6px;font-weight:600}
#bars{width:100%;height:auto;display:block;touch-action:pan-y}
#bars text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{color:var(--muted);font-size:.82rem;margin:6px 0 0}
#spanel{margin-top:16px}
.astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 12px}
.atil{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.atil small{display:block;color:var(--muted);font-size:.78rem}
.atil small span{color:var(--muted);font-weight:600}
.atil b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.atil em{display:block;font-style:normal;color:var(--muted);font-size:.75rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aproj{margin:0 0 12px;font-size:.88rem;line-height:1.5;background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);border-radius:10px;padding:8px 12px}
.aproj b{color:var(--ok)}
.aproj:empty{display:none}
.slowinfo{background:color-mix(in srgb,var(--ac) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);border-radius:10px;padding:9px 12px;font-size:.85rem;line-height:1.65;margin:0 0 10px;color:var(--ink)}
.slowinfo b{font-variant-numeric:tabular-nums}
.slowinfo[hidden]{display:none}
@media(max-width:480px){.seg button{padding:7px 9px;font-size:.85rem}}
.tabs{margin-bottom:14px}
.card.ch{grid-template-columns:90px 1fr}
.card.ch img{width:90px;height:90px;border-radius:50%}
.stat small.hid{color:var(--muted)}
.vz{margin-top:16px}
.vz .panel+.panel{margin-top:16px}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.acts button.del{margin-left:28px;color:var(--muted);font-weight:500}
.acts button.del-yes{background:var(--views);border-color:var(--views);color:#fff}
.btnlink{display:inline-block;font-size:.9rem;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none}
.btnlink:hover{border-color:var(--likes)}
body.snap #f,body.snap #exp,body.snap .del{display:none}
#home{padding:28px 0}
#home .eyebrow{color:var(--likes);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;margin:0 0 8px}
#home h2{font-size:clamp(1.8rem,6vw,3rem);line-height:1.1;margin:0 0 12px;letter-spacing:-.03em}
#home .lead{color:var(--muted);font-size:1.05rem;max-width:620px;margin:0 0 24px}
#home h3{font-size:1.05rem;margin:0 0 10px}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.hstat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.hstat small{display:block;color:var(--muted)}
.hstat b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hbtns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.hbtns .pri{background:var(--likes);border-color:var(--likes);color:#fff}
.htop{display:grid;gap:10px;margin-bottom:16px}
.htop button{text-align:left;display:flex;justify-content:space-between;gap:12px;width:100%}
.hnote{color:var(--muted);font-size:.85rem}
.chip{padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hch{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:24px}
.hch button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px}
.hch img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.hch small{display:block;color:var(--muted);font-weight:500}
body.home .wrap>:not(#home){display:none}
body:not(.home) #home{display:none}
.dvh{display:grid;grid-template-columns:minmax(0,1.5fr) auto auto auto;gap:16px 28px;align-items:start;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.dvt{display:flex;gap:14px;min-width:0}
.dvt img{width:140px;height:79px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.dvt h2{font-size:clamp(1.1rem,3vw,1.6rem);margin:0 0 6px;letter-spacing:-.02em;line-height:1.15}
.badge{display:inline-block;background:var(--views);color:#fff;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:3px;margin-right:6px}
.dvs b.big{display:block;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.dvs .gn{display:block;font-size:.85rem;font-weight:700;margin-top:4px}
.dvs small{display:block;color:var(--muted)}
.dvr{text-align:right}
.dvm{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;margin-top:18px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cgrid>div{min-width:0}
@media(max-width:760px){.cgrid{grid-template-columns:1fr}}
.dvm svg{width:100%;height:auto;display:block;touch-action:pan-y}
@media(max-width:860px){.dvh{grid-template-columns:1fr 1fr}.dvt{grid-column:1/-1}.dvm{grid-template-columns:1fr}.dvr{text-align:left}}
.rng{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.rng button{padding:8px 4px;font-size:.85rem}
.rng button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;text-align:center;margin-bottom:6px}
.dnav button{padding:8px 0}
.dnav button:disabled{opacity:.35;cursor:default}
.dnav small{display:block;color:var(--muted)}
.lt{background:var(--ac);color:#fff;font-size:.65rem;font-weight:800;padding:1px 6px;border-radius:3px;letter-spacing:.06em;margin-left:6px}
.dl{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.18em;font-size:.95rem;margin:14px 0 2px}
.dl i{width:18px;height:5px;border-radius:3px;display:inline-block}
.dvb{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.dvb h3{font-size:.72rem;letter-spacing:.15em;color:var(--muted);margin:0 0 4px}
.dvro{min-height:1.4em;font-size:.9rem;font-weight:600;margin:6px 0 0}
.mile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:12px;align-self:start}
.mile h3{font-size:.72rem;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mtop b{font-size:1.1rem}
.mtop span{font-size:.8rem;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;background:var(--views)}
.mrow{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.meta .k{color:var(--muted)}
.cov{display:flex;gap:2px;margin-top:6px}
.cov i{flex:1;height:8px;background:var(--line);border-radius:1px}
.cov i.on{background:var(--views)}
#home{padding:6px 0 24px}
.hm-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;padding:40px 34px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(800px 380px at 0% 0%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 60%),radial-gradient(700px 380px at 100% 100%,color-mix(in srgb,var(--ok) 14%,transparent),transparent 60%),var(--surface)}
.hm-live{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:5px 13px;border-radius:99px}
.hm-live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:hmPulse 2s infinite}
@keyframes hmPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
#home h2.hm-h{font-size:clamp(1.55rem,3.4vw,2.5rem);line-height:1.12;letter-spacing:-.03em;margin:16px 0 10px}
/* beranda ringkas: populer + panel kanan */
.hm-hero{padding:26px 28px}
.lead{margin:0 0 18px}
.hm-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:16px}
.hm-side{display:grid;gap:14px}
.hm-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px -24px rgba(0,0,0,.4)}
.hm-box h3{margin:0;font-size:1.06rem;letter-spacing:-.02em}
.hsub{color:var(--muted);font-size:.84rem;margin:2px 0 8px}
.hr-row{display:grid;grid-template-columns:22px 96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 8px;border-radius:10px;width:100%;text-align:left;background:transparent;border:0;transition:background .15s}
.hr-row:hover{background:var(--bg)}
.hr-row img,.hr-row .th{width:96px;height:54px;border-radius:8px;object-fit:cover;background:var(--line)}
.hr-row .rk{color:var(--muted);font-weight:800;text-align:center}
.hr-row .ti{min-width:0}
.hr-row .ti b{display:block;font-size:.9rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-row .ti small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-row .n{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.hr-row .n b{display:block;font-size:.98rem}
.hr-row .n em{display:block;color:var(--ok);font-style:normal;font-size:.76rem;font-weight:700}
.hm-more2{width:100%;margin-top:10px;padding:10px;border-radius:10px;font-weight:700}
.hm-kc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;transition:transform .15s,border-color .15s}
.hm-kc:last-child{margin-bottom:0}
.hm-kc:hover{border-color:var(--ac);transform:translateY(-1px)}
.hm-kc .ic{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;border-radius:10px;background:color-mix(in srgb,var(--ac) 15%,transparent);flex:none}
.hm-kc .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.hm-kc .tx{min-width:0;flex:1}
.hm-kc .tx b{display:block;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-kc .tx small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-kc .ar{color:var(--muted);font-weight:800;flex:none}
.hm-foot{margin-top:14px}
@media(max-width:920px){.hm-main{grid-template-columns:1fr}}
@media(max-width:560px){.hr-row{grid-template-columns:18px 84px minmax(0,1fr) auto;gap:9px;padding:7px 4px}.hr-row img,.hr-row .th{width:84px;height:47px}.hr-row .n b{font-size:.88rem}.hr-row .n em{font-size:.68rem}.hm-more2{padding:9px}.hr-row .ti b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.hr-row .ti small{white-space:normal}}
.hm-gr{background:linear-gradient(90deg,var(--ac),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}
.hm-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.hm-cta button{padding:12px 20px;border-radius:10px}
.hm-cta .pri{background:var(--ac);border-color:var(--ac);color:#fff}
.hm-feat{display:block;width:100%;padding:0;text-align:left;border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(0,0,0,.45);transition:transform .2s}
.hm-feat:hover{transform:translateY(-4px)}
.hm-feat img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.hm-feat .in{display:block;padding:14px 16px 16px}
.hm-feat small{display:block;color:var(--views);font-weight:800;letter-spacing:.12em;font-size:.7rem}
.hm-feat .t{display:block;font-size:1.02rem;margin:5px 0 10px;line-height:1.3}
.hm-feat .nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hm-feat .nums b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hm-feat .nums b span{font-size:.85rem;color:var(--muted);font-weight:600}
.hm-feat em,.hmn em{font-style:normal;color:var(--ok);font-weight:700;font-size:.85rem}
.hm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 0}
.hm-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hm-stat small{display:block;color:var(--muted);font-size:.8rem}

<script>
(function(){
var RANGES={"24h":864e5,"7d":6048e5,"30d":2592e6,"365d":31536e6,all:Infinity};
const SUMMARY_COUNT = { hour: 48, day: 60, week: 52, month: 24 };
function lowerBound(arr, t) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].t < t) lo = mid + 1; else hi = mid; }
  return lo;
}
// Pertambahan per periode = angka terakhir di periode itu dikurangi angka terakhir sebelum periode itu.
// offMin = selisih zona waktu dari browser (Date.getTimezoneOffset), supaya batas jam/hari/bulan mengikuti waktu setempat.
function summarize(arr, by, offMin, keys) {
  if (!arr.length) return [];
  const off = offMin * 60000;
  const startOf = (ms) => {
    const d = new Date(ms), y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
    if (by === "hour") return Date.UTC(y, m, day, d.getUTCHours());
    if (by === "day") return Date.UTC(y, m, day);
    if (by === "week") return Date.UTC(y, m, day) - ((d.getUTCDay() + 6) % 7) * 86400e3; // pekan dimulai hari Senin
    return Date.UTC(y, m, 1);
  };
  const step = (ls, n) => {
    if (by === "hour") return ls + n * 3600e3;
    if (by === "day") return ls + n * 86400e3;
    if (by === "week") return ls + n * 6048e5;
    const d = new Date(ls);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1);
  };
  const currentStart = startOf(Date.now() - off);
  const firstStart = startOf(arr[0].t - off);
  const out = [];
  for (let i = SUMMARY_COUNT[by] - 1; i >= 0; i--) {
    const ls = step(currentStart, -i);
    if (ls < firstStart) continue; // sebelum pencatatan dimulai
    const lo = ls + off, hi = step(ls, 1) + off, prevLo = step(ls, -1) + off;
    const a = lowerBound(arr, lo), b = lowerBound(arr, hi);
    const inb = arr.slice(a, b);
    if (!inb.length) { out.push({ t: lo, empty: true }); continue; }
    const before = a > 0 ? arr[a - 1] : null;
    const base = before || inb[0];
    const end = inb[inb.length - 1];
    const gain = (k) => (base[k] === null || end[k] === null || base[k] === undefined || end[k] === undefined ? null : end[k] - base[k]);
    const g = {};
    keys.forEach((k) => { g[k] = gain(k); });
    out.push({
      t: lo, ...g,
      partial: !before,                          // pencatatan baru mulai di tengah periode ini
      gap: !!before && before.t < prevLo,        // ada periode kosong sebelumnya, pertambahan ikut menghitung celah itu
      live: hi > Date.now(),                     // periode masih berjalan
    });
  }
  return out;
}


function jl(t){return t.split("\n").filter(Boolean).map(function(l){try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean)}
function get(u,txt){return fetch(u+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return txt?r.text():r.json()}).catch(function(){return txt?"":[]})}
function group(rows){var m={};rows.forEach(function(r){(m[r.id]=m[r.id]||[]).push(r)});return m}
function arrOf(S,kind,id){return ((kind==="channel"?S.cs:S.vs)[id])||[]}
function refresh(){
  return Promise.all([get("data/videos.json"),get("data/channels.json"),get("data/samples.jsonl",1),get("data/channel_samples.jsonl",1)]).then(function(a){
    var vs=group(jl(a[2])),cs=group(jl(a[3])),last=0;
    [vs,cs].forEach(function(m){Object.keys(m).forEach(function(k){m[k].sort(function(x,y){return x.t-y.t})})});
    function items(list,m){return list.map(function(v){var arr=m[v.id]||[];if(arr.length)last=Math.max(last,arr[arr.length-1].t);return Object.assign({},v,{latest:arr[arr.length-1]||null,prev:arr[arr.length-2]||null,first:arr[0]||null})})}
    var S=window.SNAPSHOT=window.SNAPSHOT||{live:true,intervalSeconds:300,error:null};
    S.tracked=items(a[0],vs);S.channels=items(a[1],cs);S.vs=vs;S.cs=cs;S.at=Date.now();
    S.statusText="Data dicatat otomatis oleh GitHub kira-kira tiap 5 menit (bisa tertunda)."+(last?" Catatan terakhir: "+new Date(last).toLocaleString("id-ID")+".":"");
    // Riwayat untuk grafik: jika sampel terlalu banyak, padatkan per bucket waktu
    // (ambil catatan TERAKHIR tiap bucket) supaya bentuk langkah angka tetap terbaca.
    S.histFn=function(kind,id,rk){
      var range=RANGES[rk]||RANGES["24h"],now=Date.now();
      var r=arrOf(S,kind,id).filter(function(s){return range===Infinity||s.t>=now-range});
      if(r.length>600){
        var span=range===Infinity?(r[r.length-1].t-r[0].t):range;
        var bk=Math.max(span/600,300e3),out=[],lastp=r[r.length-1];
        for(var i=0;i<r.length;i++){var b=Math.floor(r[i].t/bk);if(i===r.length-1||Math.floor(r[i+1].t/bk)!==b)out.push(r[i])}
        if(out[out.length-1]!==lastp)out.push(lastp);
        r=out;
      }
      return r;
    };
    S.sumFn=function(kind,id,by,tz){return summarize(arrOf(S,kind,id),by,tz,kind==="channel"?["s","v","n"]:["v","l","c"])};
  });
}

refresh().then(function(){
  var s=document.createElement("script");s.textContent=document.getElementById("main").textContent;document.body.appendChild(s);
  setInterval(refresh,60000);
});
})();

  opt=opt||{};opt.headers=Object.assign({"Content-Type":"application/json","X-Requested-With":"ytlive"},opt.headers||{});
  return fetch(path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Kesalahan "+r.status));return j})});
}
function setStatus(msg,err,off){
  var s=$("status");s.className=err?"err":"";s.innerHTML="";
  s.appendChild(el("span","dot"+(err||off?" off":"")));s.appendChild(document.createTextNode(msg));
}
function parseId(s){
  s=s.trim();
  if(/^[\w-]{11}$/.test(s))return s;
  try{
    var u=new URL(s),h=u.hostname.replace(/^www\./,"");
    if(h==="youtu.be")return u.pathname.slice(1,12);
    var m=u.pathname.match(/^\/(?:shorts|live|embed)\/([\w-]{11})/);
    if(m)return m[1];
    var v=u.searchParams.get("v");
    if(v&&/^[\w-]{11}$/.test(v))return v;
  }catch(e){}
  return null;
}
function niceTicks(mn,mx,n){
  var rg=mx-mn||1,step=Math.pow(10,Math.floor(Math.log10(rg/n))),e=rg/n/step;
  step*=(e<=1?1:e<=2?2:e<=5?5:10);
  step=Math.max(1,step); /* semua metrik adalah hitungan bulat — langkah pecahan tidak berguna */
  var out=[],s=Math.ceil(mn/step)*step,i,v;
  for(v=s;v<=mx+1e-9;v+=step)out.push(v);
  /* Saat skala diperbesar sangat rapat (jendela sempit), bisa jadi hanya ada
     satu tick — perkecil langkahnya agar minimal ada 2 garis bantu. */
  var guard=0;
  while(out.length<2&&step>1&&guard++<8){
    step=Math.max(1,Math.round(step/2));
    out=[];s=Math.ceil(mn/step)*step;
    for(v=s;v<=mx+1e-9;v+=step)out.push(v);
  }
  return out;
}
/* Label sumbu Y sadar-skala: makin rapat grid, makin banyak digit ditampilkan
   (29,55 jt → 29,5124 jt → 29.512.400), jadi perubahan kecil pada subscriber /
   total view yang besar langsung terlihat berbeda tanpa harus menunggu lama. */
function ylab(v,step){
  var a=Math.abs(v);
  if(a<1e5)return fmt(Math.round(v));
  step=Math.max(step||1,1);
  var U=[[1e9," M"],[1e6," jt"],[1e3," rb"]];
  for(var i=0;i<U.length;i++){
    if(a>=U[i][0]){
      var d=Math.max(0,Math.ceil(Math.log10(U[i][0])-Math.log10(step)-1e-9));
      if(d<=3)return (v/U[i][0]).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d})+U[i][1];
      break;
    }
  }
  return fmt(Math.round(v));
}
function yticks(ticks){
  var step=ticks.length>1?Math.abs(ticks[1]-ticks[0]):Math.abs(ticks[0]||1);
  var labs=ticks.map(function(v){return ylab(v,step)}),seen={},dup=false;
  labs.forEach(function(s){if(seen[s])dup=true;seen[s]=1});
  if(dup)labs=ticks.map(function(v){return fmt(Math.round(v))});
  return labs;
}
function plabel(t,b,short){
  var d=new Date(t);
  if(b==="hour")return short?hhmm(t):d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" "+hhmm(t);
  if(b==="day"||b==="week")return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"});
  return d.toLocaleDateString("id-ID",{month:"short",year:"numeric"});
}
function notes(x){
  var a=[];
  if(x.empty)a.push("Tidak ada data");
  if(x.partial)a.push("Pencatatan baru mulai di periode ini");
  if(x.gap)a.push("Termasuk celah saat tidak ada pencatatan");
  if(x.live)a.push("Periode masih berjalan");
  return a.join("; ");
}

  // Hari terbaik dihitung langsung dari data mentah (tanpa batas jumlah periode),

  function bestDay(arr,mk,t0){
    var best=null,i=0,n=arr.length,prev=atT(arr,t0)||arr[0],curD=null,base=null,end=null,fl=null,nowD=floorB(Date.now());
    for(;i<n;i++){
      var s=arr[i];
      if(s.t<t0)continue;
      var d=floorB(s.t);
      if(curD===null){curD=d;base=prev;end=s;fl={live:nowD===d,partial:base.t>=d}}
      else if(d!==curD){
        if(base&&base[mk]!=null&&end[mk]!=null){var g=end[mk]-base[mk];if(best===null||g>best.g)best={g:g,t:curD,live:fl.live,partial:fl.partial}}
        curD=d;base=prev;end=s;fl={live:nowD===d,partial:false};
      }else end=s;
      prev=s;
    }
    if(curD!==null&&base&&base[mk]!=null&&end[mk]!=null){var g2=end[mk]-base[mk];if(best===null||g2>best.g)best={g:g2,t:curD,live:fl.live,partial:fl.partial}}
    return best;

    if(!arr||arr.length<2||!st.id){
      q("atrl").textContent="";put(tE.tot,"–");q("ats1").textContent="menunggu data";
      put(tE.avg,"–");q("ats2").textContent="";put(tE.best,"–");q("ats3").textContent="";
      put(tE.tr,"–");q("ats4").textContent="";q("proj").textContent="";return;
    }

    var base=atT(arr,t0)||arr[0];

    var span=Math.max(1,last.t-t0),days=span/864e5;
    q("atrl").textContent="· "+VRLBL[st.r];
    if(tot===null){put(tE.tot,"–");q("ats1").textContent="angka tidak tersedia"}
    else{put(tE.tot,sg(tot),tot>0?"var(--ok)":tot<0?"var(--views)":"");q("ats1").textContent=partial?"sejak pencatatan dimulai":VRLBL[st.r]}
    if(tot!==null&&days>0){
      if(st.r==="24h"){var pj=span/36e5;put(tE.avg,sg(Math.round(tot/(pj||1)*10)/10),tot>0?"var(--ok)":tot<0?"var(--views)":"");q("ats2").textContent="per jam ("+(Math.round(pj*10)/10)+" jam data)"}
      else{var ad=tot/days;put(tE.avg,sg(Math.abs(ad)<10?Math.round(ad*10)/10:Math.round(ad)),tot>0?"var(--ok)":tot<0?"var(--views)":"");q("ats2").textContent="per hari (±"+(Math.round(days*10)/10)+" hari)"}
    }else{put(tE.avg,"–");q("ats2").textContent=""}
    var best=bestDay(arr,mk,t0);
    if(best){put(tE.best,sg(best.g),best.g>0?"var(--ok)":best.g<0?"var(--views)":"");q("ats3").textContent=plabel(best.t,"day")+(best.live?" (berjalan)":best.partial?" (sebagian)":"")}
    else{put(tE.best,"–");q("ats3").textContent="belum ada hari penuh"}
    var mid=t0+span/2,mS=atT(arr,mid)||base;
    var g1=(mS[mk]!=null&&base[mk]!=null)?mS[mk]-base[mk]:null;
    var g2=(last[mk]!=null&&mS[mk]!=null)?last[mk]-mS[mk]:null;
    if(g1===null||g2===null){put(tE.tr,"–");q("ats4").textContent="data tidak cukup"}
    else{
      var dlt=g2-g1;

function chgData(chs,rows){
  var cs=(window.SNAPSHOT||{}).cs||{},per=[],subs=[],top=null;
  chs.forEach(function(c){
    var a=cs[c.id]||[],step=null,vt=null,vh=null,i,p,q;
    for(i=1;i<a.length;i++){
      p=a[i-1];q=a[i];
      if(p.s!=null&&q.s!=null&&q.s!==p.s)step={t:q.t,from:p.s,to:q.s,d:q.s-p.s};
    }
    if(step)subs.push({ch:c.title||c.id,t:step.t,from:step.from,to:step.to,d:step.d});
    if(a.length){
      var l=a[a.length-1],d0=new Date();d0.setHours(0,0,0,0);
      var b0=atT(a,d0.getTime())||a[0];
      if(l.v!=null&&b0.v!=null)vt={d:l.v-b0.v};
      var bh=atT(a,l.t-36e5);
      if(bh&&l.v!=null&&bh.v!=null)vh={d:l.v-bh.v,t:l.t,now:l.v};
    }
    per.push({ch:c,step:step,vt:vt,vh:vh});
  });
  rows.forEach(function(r){if(r.s&&r.s.g24>0&&(!top||r.s.g24>top.g))top={g:r.s.g24,v:r.v}});
  subs.sort(function(a,b){return b.t-a.t});
  return {per:per,subs:subs,top:top};
}
